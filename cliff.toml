[changelog]
header = ""
# The commit link carries the full URL. A release note is rendered on a page under
# /releases/tag/, so a bare SHA is a relative href and resolves to a tag that does
# not exist; GitHub's markdown API leaves it exactly as written.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/ring0networks/browser_support/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^harden",   group = "Security" },
  { message = "^refactor", group = "Refactor" },
  { message = "^ci",       group = "CI" },
  { message = "^docs",     group = "Documentation" },
  { message = "^chore",    skip = true },
  { message = "^test",     skip = true },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
