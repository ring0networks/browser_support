# A pull request that changes this workflow, the changelog configuration or a
# release script runs it as a dry run: it writes the changelog, verifies the
# version and builds the tarball, and it uploads nothing and skips the release.
# Its version is the manifest version with a -dry-run suffix, so the manifest
# check runs as it does for a tag.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - cliff.toml
      - scripts/**
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0-test)'
        required: true
        default: 'v0.0.0-test'

# Every job only reads the checkout; the one that publishes raises its own to
# contents: write, and a job-level block replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # the manifest is read only on a pull request, for the dry-run version
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - id: v
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            manifest="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' manifest_v3/manifest.json | head -1)"
            RAW_VERSION="v${manifest}-dry-run"
          fi
          # Validate before it flows into any downstream shell/action input.
          if [[ ! "$RAW_VERSION" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "error: invalid version '$RAW_VERSION' (expected v<A-Za-z0-9._->)" >&2
            exit 1
          fi
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: [resolve-version]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            ${{ github.event_name != 'push'
                && format('--unreleased --tag {0}', needs.resolve-version.outputs.version)
                || format('--latest --tag {0}', needs.resolve-version.outputs.version) }}
        env:
          OUTPUT: CHANGELOG.md

      # The message of the annotated tag says what the release is about, and it
      # opens the notes. checkout can leave the tag lightweight, so it is fetched
      # again. A manual run or a dry run has no tag, and its notes open with the
      # subjects alone.
      - name: Open the notes with the message of the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          if [ "$(git cat-file -t "refs/tags/$VERSION")" != tag ]; then
            echo "::warning::$VERSION is a lightweight tag, so the notes carry no description"
            exit 0
          fi
          message=$(git for-each-ref --format='%(contents)' "refs/tags/$VERSION" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          if [ -z "$message" ] || [ "$message" = "$VERSION" ]; then
            echo "::warning::the message of $VERSION does not describe the release"
            exit 0
          fi
          { printf '%s\n\n' "$message"; cat CHANGELOG.md; } > notes.tmp
          mv notes.tmp CHANGELOG.md

      # a pull request uploads nothing, so its dry run leaves no artifact
      - name: Show the dry run
        if: github.event_name == 'pull_request'
        run: cat CHANGELOG.md

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    needs: [resolve-version, changelog]
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash scripts/verify-version.sh "$VERSION"

      - name: Build release tarball
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash scripts/package.sh "$VERSION"

      - name: Show the dry run
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: tar -tzf "ringzero-dome-browser-extension-$VERSION.tar.gz"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: package
          path: ringzero-dome-browser-extension-${{ needs.resolve-version.outputs.version }}.tar.gz
          retention-days: 1

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [resolve-version, package, changelog]
    # the dry run stops before the release and the tag
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - uses: actions/download-artifact@v8
        with:
          name: package

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: CHANGELOG.md
          files: ringzero-dome-browser-extension-${{ needs.resolve-version.outputs.version }}.tar.gz
