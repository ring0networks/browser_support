name: Checks
on:
  pull_request:

# the check reads a checkout; nothing here writes to the repository
permissions:
  contents: read

jobs:
  # actionlint reads every workflow: its syntax, its expressions, the inputs of
  # each action and the shell of each step, through the shellcheck of the image
  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      # the archive is 2.3 MB from the GitHub release, so a cache would restore
      # as much as it downloads, and the job caches nothing
      - name: Download actionlint and check its checksum
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: The workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
